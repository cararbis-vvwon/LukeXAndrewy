<!DOCTYPE html> 
<html> 
<head> 
    <title>Main menu</title> 
 
    <style> 
        body { 
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-image: url('POLKA.jpg');
            padding: 30px; 
        }
 
        h1 { 
            text-align: center; 
            color: #003F88; 
        } 
 
        
        .menu { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            flex-wrap: wrap; 
            background-color: #accbe0; 
            padding: 20px; 
            border-radius: 12px; 
        } 
 
        
        .menu-item { 
            position: relative; 
        } 
 
        .menu a { 
            display: block; 
            background-color: #00509D; 
            color: #E7ECEF; 
            padding: 12px 20px; 
            text-decoration: none; 
            border-radius: 6px; 
            transition: 0.3s ease; 
        } 
 
        
        .menu a:hover { 
            background-color: #6096BA; 
            color: #222; 
            transform: translateY(-5px); 
            box-shadow: 0 0 10px #1B3B6F, 
                        0 0 25px #0ff; 
        } 
 
        
        .submenu { 
            display: none; 
            position: absolute; 
            top: 100%; 
            left: 0; 
            min-width: 160px; 
            background-color: #FFD500; 
            padding: 8px; 
            border-radius: 8px; 
            z-index: 10; 
        } 
 
      
        .menu-item:hover .submenu { 
            display: block; 
        } 
 
      
        .submenu a { 
            background-color: #FDC500; 
            margin: 5px 0; 
            border-radius: 5px; 
        } 
 
        .submenu a:hover { 
            background-color: #9EB3C2; 
            transform: translateX(5px); 
        } 
 
    </style> 
</head> 
 
<body> 
 
    <img src="Logo_ARBIS.jpg" width="300" height="120">
    
    <h1>MY WEBSITE MENU</h1> 

    <header>
 <div class="logo">
    <img url="Logo_ARBIS.jpg" >
  <a href="">Travel and Tourism</a>
 </div>
 <nav>
  <ul>
   <li><a href="#">Home</a></li>
   <li><a href="#">About</a></li>
   <li><a href="#">Destinations</a></li>
   <li><a href="#">Contact</a></li>
  </ul>
 </nav>
    </header>


 
</body> 
</html>
